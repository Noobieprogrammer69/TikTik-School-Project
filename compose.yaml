name: tiktok-clone-school

services:
  mongo:
    image: mongo:8.0.30-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-tiktokadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Copy .env.example to .env and set MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo-test:
    image: mongo:8.0.30-noble
    profiles: ["test"]
    command: ["mongod", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-tiktokadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/tiktok_clone?authSource=admin
      MONGODB_DATABASE: tiktok_clone
      MEDIA_ROOT: /data/media
      BACKEND_LISTEN_ADDRESS: 0.0.0.0
      BACKEND_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-300}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      TEST_AUTH_KEY: ${TEST_AUTH_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      ENABLE_MEDIA_PROCESSING: ${ENABLE_MEDIA_PROCESSING:-true}
      FFMPEG_BINARY: ffmpeg
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - media_data:/data/media
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
  media_data:
